<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev4AI Enterprise PM Dashboard</title>
  <meta name="description" content="Dev4AI – AI-powered project management for engineering teams" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e6ed;
      --text-muted: #8b8fa3;
      --accent: #6366f1;
      --status-todo: #f59e0b;
      --status-in-progress: #3b82f6;
      --status-done: #22c55e;
      --status-urgent: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .app-shell { display: flex; height: 100vh; }
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; }
    .main-content { flex: 1; overflow-y: auto; padding: 24px; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 24px; }
    .nav-item { padding: 8px 12px; border-radius: 6px; color: var(--text-muted); cursor: pointer; margin-bottom: 4px; }
    .nav-item.active { background: rgba(99,102,241,0.12); color: var(--accent); }
    .board-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .board-title { font-size: 20px; font-weight: 600; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .kanban-column { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 200px; }
    .column-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .ticket-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: grab; }
    .ticket-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .ticket-meta { font-size: 12px; color: var(--text-muted); }
    .activity-feed { margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .activity-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 480px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">DEVAI</div>
      <nav>
        <div class="nav-item active" data-view="board">Board</div>
        <div class="nav-item" data-view="tickets">Tickets</div>
        <div class="nav-item" data-view="sprints">Sprints</div>
        <div class="nav-item" data-view="activity">Activity</div>
      </nav>
    </aside>

    <main class="main-content">
      <div class="board-header">
        <h1 class="board-title">Kanban Board</h1>
        <div style="display:flex;gap:8px;">
          <button class="btn" onclick="showModal('createTicketModal')">+ Ticket</button>
          <button class="btn" onclick="showModal('createSprintModal')">+ Sprint</button>
          <button class="btn" onclick="showModal('linkRepoModal')">Link Repo</button>
          <button class="btn" onclick="showModal('importIssueModal')">Import Issue</button>
        </div>
      </div>

      <div class="kanban-board">
        <div class="kanban-column" id="col-todo">
          <div class="column-header">
            <span class="status-dot" style="background:var(--status-todo)"></span>
            <span>TODO</span>
          </div>
        </div>
        <div class="kanban-column" id="col-in-progress">
          <div class="column-header">
            <span class="status-dot" style="background:var(--status-in-progress)"></span>
            <span>IN PROGRESS</span>
          </div>
        </div>
        <div class="kanban-column" id="col-done">
          <div class="column-header">
            <span class="status-dot" style="background:var(--status-done)"></span>
            <span>DONE</span>
          </div>
        </div>
      </div>

      <div class="activity-feed">
        <div class="activity-title">Recent Activity</div>
        <div id="activity-feed-list"></div>
      </div>
    </main>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-content">
      <div class="modal-title">Sign In</div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" style="width:100%" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- Create Ticket Modal -->
  <div class="modal-overlay" id="createTicketModal">
    <div class="modal-content">
      <div class="modal-title">Create Ticket</div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="ticketTitle" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="ticketDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="ticketPriority">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="URGENT">Urgent</option>
        </select>
      </div>
      <button class="btn" style="width:100%" onclick="handleCreateTicket()">Create</button>
    </div>
  </div>

  <!-- Create Sprint Modal -->
  <div class="modal-overlay" id="createSprintModal">
    <div class="modal-content">
      <div class="modal-title">Create Sprint</div>
      <div class="form-group">
        <label>Sprint Name</label>
        <input type="text" id="sprintName" />
      </div>
      <button class="btn" style="width:100%" onclick="closeModal('createSprintModal')">Create</button>
    </div>
  </div>

  <!-- Link Repo Modal -->
  <div class="modal-overlay" id="linkRepoModal">
    <div class="modal-content">
      <div class="modal-title">Link GitHub Repository</div>
      <div class="form-group">
        <label>Repository URL</label>
        <input type="text" id="repoUrl" placeholder="owner/repo" />
      </div>
      <button class="btn" style="width:100%" onclick="closeModal('linkRepoModal')">Link</button>
    </div>
  </div>

  <!-- Import Issue Modal -->
  <div class="modal-overlay" id="importIssueModal">
    <div class="modal-content">
      <div class="modal-title">Import GitHub Issue</div>
      <div class="form-group">
        <label>Issue Number</label>
        <input type="number" id="issueNumber" />
      </div>
      <button class="btn" style="width:100%" onclick="closeModal('importIssueModal')">Import</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
