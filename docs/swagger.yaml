  /github/webhooks:
    post:
      tags:
        - GitHub
      summary: Handle incoming GitHub webhooks
      description: Production-safe GitHub webhook receiver. Authenticates using X-Hub-Signature-256 HMAC-SHA256 verification and ensures idempotency using X-GitHub-Delivery. Does not require DEVAI JWT authentication.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 signature of request payload
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
          description: Unique delivery GUID from GitHub
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: Name of GitHub event (e.g. issues, pull_request, push)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed successfully or already handled
        '400':
          description: Missing signature / delivery headers or malformed payload
        '401':
          description: Invalid webhook HMAC signature
