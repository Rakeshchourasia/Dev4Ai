      summary: Change ticket status
      description: |
        Enforces the status lifecycle:
        - TODO → IN_PROGRESS
        - IN_PROGRESS → TODO or DONE
        - DONE is terminal (no further transitions allowed)
        Cannot change status of a ticket in a COMPLETED sprint.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
