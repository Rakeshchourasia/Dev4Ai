  /github/connection:
    get:
      tags:
        - GitHub
      summary: Get GitHub connection status
      description: |
        Returns safe, public information about the authenticated user's GitHub connection.
        **Never returns** access tokens, refresh tokens, or client secrets.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connection status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: GitHub connection found
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                        example: true
                      github:
                        type: object
                        description: Only present when connected is true
                        properties:
                          id:
                            type: string
                            description: GitHub numeric user ID
                            example: "11223344"
                          username:
                            type: string
                            description: GitHub login/username
                            example: "octocat"
                          avatarUrl:
                            type: string
                            format: uri
                            description: GitHub avatar URL (public, derived from GitHub user ID)
                            example: "https://avatars.githubusercontent.com/u/11223344"
        '401':
          description: Unauthorized - missing or invalid DEVAI JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - GitHub
      summary: Remove GitHub connection
      description: |
        Revokes the stored GitHub OAuth token (best-effort via GitHub API) and
        removes the local GitHub connection record.

        **Does NOT** delete the DEVAI user account or the `user_auth_accounts` identity record.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: GitHub connection removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: GitHub connection removed successfully
        '401':
          description: Unauthorized - missing or invalid DEVAI JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No GitHub connection found for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /github/organizations:
    get:
      tags:
        - GitHub
      summary: List GitHub organizations
      description: |
        Returns all GitHub organizations accessible to the authenticated user's
        connected GitHub account. Requires a valid GitHub connection.
        **Never** accepts or returns a GitHub access token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizations fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Organizations fetched successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1234567
                        login:
                          type: string
                          example: my-company
                        avatarUrl:
                          type: string
                          format: uri
                          example: https://avatars.githubusercontent.com/u/1234567
                        description:
                          type: string
                          nullable: true
                          example: We build great software
        '401':
          description: Unauthorized - missing or invalid DEVAI JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: GitHub access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No GitHub connection found for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: GitHub API request timed out
          content:
            application/json:
